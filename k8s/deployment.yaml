apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-theater
  labels:
    app: home-theater
spec:
  replicas: 1
  # One writer for /data (analysis scores, thumbnails, scene edits): stop the old pod before starting the new one
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-theater
  template:
    metadata:
      labels:
        app: home-theater
    spec:
      imagePullSecrets:
        - name: dockerhub
      initContainers:
        # Pull demos/, movies/, music/ from the public media bucket onto the media volume.
        # The bucket is the source of truth (--delete); only new or changed files are downloaded.
        # If S3 can't be reached, start anyway with whatever is already on the volume.
        - name: media-sync
          image: amazon/aws-cli:2.42.3
          command: ["/bin/sh", "-c"]
          args:
            - >-
              aws s3 sync "s3://$MEDIA_BUCKET/" /media/ --delete --no-sign-request --region us-west-1 --no-progress
              || echo "media sync failed; starting with what is already on the volume"
          env:
            - name: MEDIA_BUCKET
              value: kwk8s-home-theater-files
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              # aws-cli buffers downloads in memory; multi-GB movies need headroom
              memory: 1Gi
          volumeMounts:
            - name: media
              mountPath: /media
      containers:
        - name: home-theater
          image: kristianwindsor/home-theater-demo:latest
          ports:
            - containerPort: 8080
          env:
            - name: ANALYZER_CONCURRENCY
              value: "1"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              # the music analyzer (numpy) and ffmpeg spike while a song is being analyzed
              memory: 2Gi
          volumeMounts:
            # demos/, movies/, music/: the app only reads these
            - name: media
              mountPath: /media
              readOnly: true
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: home-theater-media
        - name: data
          persistentVolumeClaim:
            claimName: home-theater-data

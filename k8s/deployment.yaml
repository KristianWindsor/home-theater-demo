apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-theater
  labels:
    app: home-theater
spec:
  replicas: 1
  # One writer for /data (analysis scores, thumbnails, scene edits): stop the old pod before starting the new one
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-theater
  template:
    metadata:
      labels:
        app: home-theater
    spec:
      imagePullSecrets:
        - name: dockerhub
      initContainers:
        # Pull demos/, trailers/ and music/ from the media bucket onto the media volume (music plays through Web Audio,
        # which needs it same-origin). Movies stay in the bucket and stream from CloudFront.
        # The bucket is the source of truth (--delete); only new or changed files are downloaded.
        # If S3 can't be reached, start anyway with whatever is already on the volume.
        - name: media-sync
          image: amazon/aws-cli:2.42.3
          command: ["/bin/sh", "-c"]
          args:
            - >-
              aws s3 sync "s3://$MEDIA_BUCKET/" /media/ --delete --exclude 'movies/*' --region us-west-1 --no-progress
              || echo "media sync failed; starting with what is already on the volume"
          env:
            - name: MEDIA_BUCKET
              value: kwk8s-home-theater-files
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: home-theater-media
                  key: aws-access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: home-theater-media
                  key: aws-secret-access-key
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: media
              mountPath: /media
      containers:
        - name: home-theater
          image: kristianwindsor/home-theater-demo:latest
          ports:
            - containerPort: 8080
          env:
            - name: ANALYZER_CONCURRENCY
              value: "1"
            # Movies: listed and probed from the bucket, played from CloudFront with signed links
            - name: MEDIA_BUCKET
              value: kwk8s-home-theater-files
            - name: MEDIA_BUCKET_REGION
              value: us-west-1
            - name: MEDIA_CDN_URL
              value: https://home-theater-media.kwk8s.tech
            - name: MEDIA_CDN_KEY_PAIR_ID
              value: KA673EAIJBHY4
            - name: MEDIA_CDN_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: home-theater-media
                  key: cdn-private-key.pem
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: home-theater-media
                  key: aws-access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: home-theater-media
                  key: aws-secret-access-key
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              # the music analyzer (numpy) and ffmpeg spike while a song is being analyzed
              memory: 2Gi
          volumeMounts:
            # demos/, trailers/, movies/, music/: the app only reads these
            - name: media
              mountPath: /media
              readOnly: true
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: home-theater-media
        - name: data
          persistentVolumeClaim:
            claimName: home-theater-data

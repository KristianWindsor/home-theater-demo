services:
  kw51:
    build: .
    image: kw51:latest
    container_name: kw51
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Your files: demos/, trailers/, movies/, music/ (read-only is fine; nothing is written here)
      - ./media:/media:ro
      # Analysis scores, thumbnails, cover art, lossless FLAC fallbacks and in-app scene edits
      - kw51-data:/data
      # catalog.json (scene lists, reels) and room.json (the 3D room). Edit without rebuilding.
      - ./config:/app/config:ro
    environment:
      - ANALYZER_CONCURRENCY=1      # songs analyzed in parallel (CPU cores to spare)
      # - ALLOW_SCENE_EDITS=false   # lock the scene lists

volumes:
  kw51-data:

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030406">
  <title>KW 5.1</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <canvas id="gl" aria-hidden="true"></canvas>
  <video id="video" playsinline preload="metadata"></video>
  <audio id="music" preload="auto" crossorigin="anonymous"></audio>
  <div id="ui"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="splash" class="splash">
    <div class="splash-inner">
      <div class="brand-mark">KW 5.1</div>
      <div class="splash-sub" id="splash-sub">Home theater showcase</div>
      <button class="btn btn-primary btn-xl" id="enter" autofocus>Enter</button>
      <div class="splash-hint">Fullscreen + sound. Use a mouse, the arrow keys or a remote.</div>
    </div>
  </div>
  <noscript>KW 5.1 needs JavaScript.</noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
